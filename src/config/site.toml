  "一个在 AI全栈方向 探索的求职者, 热爱技术、 也热爱生活。",
  "项目、文章、成长, 都在这里。",
  "如果你是 HR 或面试官，欢迎看看我的作品集；如果只是路过，也欢迎随便逛逛。",
]

[config.home.latest]
count = 1
heatmapWeeks = 24
showHeatmapLatest = true
excludeDraft = true
startDate = ""
dateArchiveBaseHref = ""
# 以下三个基数只影响首页统计数字的显示值（显示 = 基数 + 实时计算），
# 不影响下方热力图格子；改为 0 即恢复纯真实值。
totalPostsBase = 0
activeDaysBase = 30
dayStreakBase = 12

