name: Sync contribution heatmap

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/sync-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_GITHUB_TOKEN || github.token }}
          GITHUB_CONTRIBUTION_USERNAME: ${{ vars.GITHUB_CONTRIBUTION_USERNAME || 'qfx2007' }}
          GITEE_CONTRIBUTION_USERNAME: ${{ vars.GITEE_CONTRIBUTION_USERNAME || 'qu-fangxiang' }}
      - name: Commit changed data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/contributions.json
          git diff --cached --quiet || git commit -m "chore: update contribution heatmap"
          git diff HEAD~1 --quiet || git push
