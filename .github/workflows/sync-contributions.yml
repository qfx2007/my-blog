name: Sync contribution heatmap

on:
  schedule:
    # GitHub Actions 使用 UTC，这个时间对应北京时间每天 10:00。
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: sync-contributions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/sync-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_GITHUB_TOKEN || github.token }}
          GITHUB_CONTRIBUTION_USERNAME: ${{ vars.GITHUB_CONTRIBUTION_USERNAME || 'qfx2007' }}
          GITEE_CONTRIBUTION_USERNAME: ${{ vars.GITEE_CONTRIBUTION_USERNAME || 'qu-fangxiang' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      - name: Commit changed data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/contributions.json
          if git diff --cached --quiet; then
            echo "Contribution data is already up to date."
            exit 0
          fi
          git commit -m "chore: update contribution heatmap"
          git push
